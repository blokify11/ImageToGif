<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blokify | Image to GIF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20260502-1" />
  </head>
  <body>
    <div id="cursorDot" class="cursor-dot hidden-cursor-dot" aria-hidden="true"></div>
    <main class="wrap">
      <section class="hero">
        <p class="badge">blokify.net/imagetogif</p>
        <h1>BLOKIFY - <span class="title-white">IMAGE TO GIF</span></h1>
        <p class="subtitle">
          Lade Bilder oder Videos per Drag & Drop oder Klick hoch. Wir machen sofort ein GIF daraus.
        </p>
      </section>

      <section class="card">
        <div class="mode-switch" role="group" aria-label="Ausgabe-Modus">
          <button id="modeGif" class="mode-button active" type="button" data-mode="gif">GIF erstellen</button>
          <button id="modeDiscord" class="mode-button" type="button" data-mode="discord10mb">Discord 10 MB</button>
        </div>

        <label id="dropzone" class="dropzone" for="fileInput">
          <input id="fileInput" type="file" accept="image/*,video/*" multiple hidden />
          <div class="drop-content">
            <p class="drop-title">Bilder oder Videos hier reinziehen</p>
            <p class="drop-hint">oder klicken zum Auswählen</p>
          </div>
        </label>

        <div id="status" class="status" aria-live="polite"></div>
        <div id="progressWrap" class="progress-wrap hidden" aria-live="polite">
          <div class="progress-head">
            <span id="progressLabel" class="progress-label">Komprimierung startet ...</span>
            <span id="progressValue" class="progress-value">0%</span>
          </div>
          <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="progressFill" class="progress-fill"></div>
          </div>
          <p id="progressDetail" class="progress-detail"></p>
        </div>

        <div id="result" class="result hidden">
          <p class="result-title">Fertig! Klick auf ein GIF, URL kopieren oder direkt herunterladen.</p>
          <div id="resultsGrid" class="results-grid"></div>
        </div>
      </section>
    </main>

    <script src="./script.js?v=20260502-4"></script>
  </body>
</html>
